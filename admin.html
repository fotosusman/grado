<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Usman Mancera</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="estilo.css">
    <style>
        body {
            background-color: #f8f9fa;
            color: #12120c;
        }
        .admin-container {
            max-width: 800px;
            margin: 100px auto;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .admin-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .admin-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .admin-form .full-width {
            grid-column: span 2;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .form-group label {
            font-weight: 600;
            font-size: 0.9rem;
        }
        .admin-input {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
        }
        .admin-btn {
            background-color: var(--gold);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }
        .admin-btn:hover {
            background-color: var(--gold-hover);
            transform: translateY(-2px);
        }
        .user-list {
            margin-top: 50px;
            width: 100%;
            border-collapse: collapse;
        }
        .user-list th, .user-list td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #eee;
        }
        .status-msg {
            text-align: center;
            margin-top: 20px;
            font-weight: 600;
        }
        .drop-zone {
            border: 2px dashed #ddd;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #fafafa;
        }
        .drop-zone.dragover {
            border-color: var(--gold);
            background: #f0f7ff;
        }
        .drop-zone i {
            width: 40px;
            height: 40px;
            color: #aaa;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <header class="header" style="background: white;">
        <div class="logo">
            <img src="assets/Recurso 1logousman.svg" alt="Usman Mancera Logo" style="height: 30px;">
        </div>
        <a href="index.html" class="btn-pill" style="color: #12120c; border-color: #ddd;">Ver Web</a>
    </header>

    <div class="admin-container">
        <div class="admin-header">
            <h1>Panel de Administración</h1>
            <p>Carga de carpetas y usuarios</p>
        </div>

        <form id="adminForm" class="admin-form">
            <div class="form-group">
                <label>Colegio</label>
                <input type="text" id="admin-colegio" class="admin-input" placeholder="Ej: Colegio San Patricio" required>
            </div>
            <div class="form-group">
                <label>Nombre del Alumno</label>
                <input type="text" id="admin-nombre" class="admin-input" placeholder="Nombre completo" required>
            </div>
            <div class="form-group">
                <label>Clave de Acceso</label>
                <input type="text" id="admin-clave" class="admin-input" placeholder="Clave para el alumno" required>
            </div>
            
            <div class="form-group full-width">
                <label>Fotos del Evento (Arrastra los archivos)</label>
                <div id="drop-zone" class="drop-zone">
                    <i data-lucide="upload-cloud"></i>
                    <p>Suelta las fotos aquí o haz clic para seleccionar</p>
                    <input type="file" id="fileInput" multiple accept="image/*" style="display: none;">
                    <div id="file-count" style="margin-top: 10px; font-weight: 600; color: var(--gold);"></div>
                </div>
            </div>
            
            <button type="submit" id="btnSubmitAdmin" class="admin-btn full-width">Crear Galería y Subir Fotos</button>
        </form>

        <p id="adminStatus" class="status-msg"></p>

        <div id="usersTableContainer" class="hidden">
            <h3>Usuarios Registrados</h3>
            <table class="user-list">
                <thead>
                    <tr>
                        <th>Colegio</th>
                        <th>Nombre</th>
                        <th>Carpeta</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <!-- Data will be loaded here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('fileInput');
        const fileCountDisplay = document.getElementById('file-count');
        let selectedFiles = [];

        // Drag & Drop events
        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        function handleFiles(files) {
            selectedFiles = Array.from(files);
            fileCountDisplay.innerText = `${selectedFiles.length} archivos seleccionados`;
            lucide.createIcons();
        }

        document.getElementById('adminForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const colegio = document.getElementById('admin-colegio').value;
            const nombre = document.getElementById('admin-nombre').value;
            const clave = document.getElementById('admin-clave').value;
            const status = document.getElementById('adminStatus');
            const btn = document.getElementById('btnSubmitAdmin');

            if (selectedFiles.length === 0) {
                status.innerText = "Error: Debes seleccionar al menos una foto.";
                status.style.color = "red";
                return;
            }

            status.innerText = "Procesando imágenes (esto puede tardar)...";
            status.style.color = "blue";
            btn.disabled = true;

            // Leer archivos y convertirlos a Base64
            const filePromises = selectedFiles.map(file => {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve({
                        name: file.name,
                        type: file.type,
                        base64: e.target.result.split(',')[1]
                    });
                    reader.readAsDataURL(file);
                });
            });

            const processedFiles = await Promise.all(filePromises);

            if (typeof google !== 'undefined') {
                google.script.run
                    .withSuccessHandler(function(response) {
                        if (response.success) {
                            status.innerText = "¡Galería creada y fotos subidas con éxito!";
                            status.style.color = "green";
                            document.getElementById('adminForm').reset();
                            selectedFiles = [];
                            fileCountDisplay.innerText = "";
                            loadUsers();
                        } else {
                            status.innerText = "Error: " + response.error;
                            status.style.color = "red";
                        }
                        btn.disabled = false;
                    })
                    .withFailureHandler(function(err) {
                        status.innerText = "Error crítico en el servidor.";
                        status.style.color = "red";
                        btn.disabled = false;
                    })
                    .createGalleryWithPhotos({
                        colegio: colegio,
                        nombre: nombre,
                        clave: clave,
                        files: processedFiles
                    });
            } else {
                // Mock local
                setTimeout(() => {
                    status.innerText = "¡Simulación de subida exitosa!";
                    status.style.color = "green";
                    btn.disabled = false;
                }, 2000);
            }
        });

        function loadUsers() {
            if (typeof google !== 'undefined') {
                google.script.run
                    .withSuccessHandler(function(users) {
                        const tbody = document.getElementById('usersTableBody');
                        tbody.innerHTML = "";
                        users.forEach(user => {
                            const row = `<tr>
                                <td>${user[0]}</td>
                                <td>${user[1]}</td>
                                <td><a href="https://drive.google.com/drive/folders/${user[3]}" target="_blank">Ver</a></td>
                            </tr>`;
                            tbody.innerHTML += row;
                        });
                        document.getElementById('usersTableContainer').classList.remove('hidden');
                    })
                    .getAllUsers();
            }
        }

        // Cargar al inicio
        window.onload = loadUsers;
    </script>
</body>
</html>
