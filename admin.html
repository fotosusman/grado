<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Usman Mancera</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --royal-blue: #3e4392;
            --vibrant-red: #d61218;
            --lime-green: #9cb91f;
            --white: #ffffff;
            --light-bg: #f8f9fa;
            --text-dark: #1a1a1a;
            --border-color: #e0e0e0;
            --radius-md: 12px;
            --radius-pill: 50px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--light-bg);
            color: var(--text-dark);
            line-height: 1.6;
        }

        .header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo img { height: 35px; }

        .btn-pill {
            padding: 10px 24px;
            border-radius: var(--radius-pill);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.3s;
            border: 1px solid var(--border-color);
            color: var(--text-dark);
        }

        .btn-pill:hover { background: var(--light-bg); }

        .admin-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .admin-card {
            background: white;
            border-radius: var(--radius-md);
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }

        .admin-header { margin-bottom: 30px; }
        .admin-header h1 { font-size: 1.8rem; margin-bottom: 10px; }
        .admin-header p { color: #666; }

        .admin-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group.full { grid-column: span 2; }

        label { font-size: 0.9rem; font-weight: 600; color: #444; }

        .admin-input {
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .admin-input:focus {
            outline: none;
            border-color: var(--royal-blue);
        }

        .drop-zone {
            border: 2px dashed #ddd;
            border-radius: var(--radius-md);
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #fafafa;
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--royal-blue);
            background: #f0f4ff;
        }

        .drop-zone i { width: 40px; height: 40px; color: #aaa; margin-bottom: 10px; }

        .btn-submit {
            grid-column: span 2;
            padding: 16px;
            background: var(--royal-blue);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        .btn-submit:hover { background: #2e337a; }
        .btn-submit:disabled { background: #ccc; cursor: not-allowed; }

        .status-msg {
            text-align: center;
            margin-top: 20px;
            font-weight: 600;
            min-height: 24px;
        }

        .user-list-card {
            background: white;
            border-radius: var(--radius-md);
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            text-align: left;
            padding: 15px;
            border-bottom: 1px solid #eee;
        }

        th { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: #888; }

        .hidden { display: none; }

        @media (max-width: 600px) {
            .admin-form { grid-template-columns: 1fr; }
            .form-group.full { grid-column: span 1; }
            .btn-submit { grid-column: span 1; }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo">
            <img src="assets/Recurso 1logousman.svg" alt="Usman Mancera Logo">
        </div>
        <a href="index.html" class="btn-pill">Ver Sitio Web</a>
    </header>

    <div class="admin-container">
        <div class="admin-card">
            <div class="admin-header">
                <h1>Panel de Control</h1>
                <p>Registra alumnos y sube sus fotos directamente a Google Drive.</p>
            </div>

            <div class="admin-form">
                <div class="form-group">
                    <label for="adminColegio">Colegio</label>
                    <input type="text" id="adminColegio" class="admin-input" placeholder="Nombre del Colegio" required>
                </div>
                <div class="form-group">
                    <label for="adminNombre">Nombre del Alumno</label>
                    <input type="text" id="adminNombre" class="admin-input" placeholder="Nombre Completo" required>
                </div>
                <div class="form-group full">
                    <label for="adminClave">Clave de Acceso</label>
                    <input type="text" id="adminClave" class="admin-input" placeholder="Define una clave segura" required>
                </div>

                <div class="form-group full">
                    <label>Fotos (Arrastra la carpeta o selecciona archivos)</label>
                    <div class="drop-zone" id="drop-zone">
                        <i data-lucide="upload-cloud"></i>
                        <p id="file-count">Haz clic o arrastra las fotos aquí</p>
                        <input type="file" id="fileInput" multiple accept="image/*" class="hidden">
                    </div>
                </div>

                <button id="btnRegistrar" onclick="registrarNuevoAlumno()" class="btn-submit">
                    CREAR EN DRIVE Y EXCEL
                </button>
            </div>

            <p id="statusMessage" class="status-msg"></p>
        </div>

        <div class="user-list-card">
            <h2>Registros Recientes</h2>
            <div id="usersTableContainer">
                <table>
                    <thead>
                        <tr>
                            <th>Colegio</th>
                            <th>Alumno</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <!-- Datos dinámicos -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzHa-Maq1PaTZgZmUDOv4w5LFYgd8sdJ_XxXpB21SFlt5FJRM98lW6fkpWfCJoP-ITeyQ/exec";
        
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('fileInput');
        const fileCountDisplay = document.getElementById('file-count');
        let selectedFiles = [];

        // Inicializar iconos
        lucide.createIcons();

        // Drag & Drop
        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        function handleFiles(files) {
            selectedFiles = Array.from(files);
            fileCountDisplay.innerText = `${selectedFiles.length} archivos seleccionados`;
            lucide.createIcons();
        }

        async function registrarNuevoAlumno() {
            const btn = document.getElementById('btnRegistrar');
            const status = document.getElementById('statusMessage');
            
            const colegio = document.getElementById('adminColegio').value.trim();
            const nombre = document.getElementById('adminNombre').value.trim();
            const clave = document.getElementById('adminClave').value.trim();

            if (!colegio || !nombre || !clave) {
                alert("Por favor, llena todos los campos.");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Procesando...";
            status.style.color = "blue";
            status.innerText = "Subiendo fotos y registrando en Excel...";

            try {
                // Leer archivos y convertirlos a Base64
                const filePromises = selectedFiles.map(file => {
                    return new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = (e) => resolve({
                            name: file.name,
                            type: file.type,
                            base64: e.target.result.split(',')[1]
                        });
                        reader.readAsDataURL(file);
                    });
                });

                const processedFiles = await Promise.all(filePromises);

                // Enviar datos vía POST a Google Apps Script
                await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors', 
                    body: JSON.stringify({
                        action: 'createGallery',
                        colegio: colegio,
                        nombre: nombre,
                        clave: clave,
                        files: processedFiles
                    })
                });

                // Con no-cors no podemos leer la respuesta, pero si no hay error, asumimos éxito
                status.style.color = "green";
                status.innerText = "¡Petición enviada! Verifica tu Excel y Drive en unos segundos.";
                
                // Limpiar campos
                document.getElementById('adminColegio').value = "";
                document.getElementById('adminNombre').value = "";
                document.getElementById('adminClave').value = "";
                selectedFiles = [];
                fileCountDisplay.innerText = "Haz clic o arrastra las fotos aquí";
                
                setTimeout(loadUsers, 2000);

            } catch (error) {
                console.error(error);
                status.style.color = "red";
                status.innerText = "Error al conectar con el servidor.";
            } finally {
                btn.disabled = false;
                btn.innerText = "CREAR EN DRIVE Y EXCEL";
            }
        }

        async function loadUsers() {
            try {
                const response = await fetch(`${APPS_SCRIPT_URL}?action=getAllUsers`);
                const users = await response.json();
                const tbody = document.getElementById('usersTableBody');
                tbody.innerHTML = "";
                users.forEach(user => {
                    const row = `<tr>
                        <td>${user[0]}</td>
                        <td>${user[1]}</td>
                        <td><a href="https://drive.google.com/drive/folders/${user[3]}" target="_blank" style="color: var(--royal-blue); font-weight: 600;">Ver Carpeta</a></td>
                    </tr>`;
                    tbody.innerHTML += row;
                });
            } catch (error) {
                console.error("Error cargando usuarios:", error);
            }
        }

        // Cargar al inicio
        window.onload = loadUsers;
    </script>
</body>
</html>
