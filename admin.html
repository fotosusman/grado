<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Usman Mancera</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js/dist/umd/supabase.min.js"></script>
    <style>
        :root {
            --royal-blue: #3e4392;
            --vibrant-red: #d61218;
            --lime-green: #9cb91f;
            --white: #ffffff;
            --light-bg: #f8f9fa;
            --text-dark: #1a1a1a;
            --border-color: #e0e0e0;
            --radius-md: 12px;
            --radius-pill: 50px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--light-bg);
            color: var(--text-dark);
            line-height: 1.6;
        }

        .header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo img { height: 35px; }

        .btn-pill {
            padding: 10px 24px;
            border-radius: var(--radius-pill);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.3s;
            border: 1px solid var(--border-color);
            color: var(--text-dark);
        }

        .btn-pill:hover { background: var(--light-bg); }

        .admin-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .admin-card {
            background: white;
            border-radius: var(--radius-md);
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }

        .admin-header { margin-bottom: 30px; }
        .admin-header h1 { font-size: 1.8rem; margin-bottom: 10px; }
        .admin-header p { color: #666; }

        .admin-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group.full { grid-column: span 2; }

        label { font-size: 0.9rem; font-weight: 600; color: #444; }

        .admin-input {
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .admin-input:focus {
            outline: none;
            border-color: var(--royal-blue);
        }

        .drop-zone {
            border: 2px dashed #ddd;
            border-radius: var(--radius-md);
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #fafafa;
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--royal-blue);
            background: #f0f4ff;
        }

        .drop-zone i { width: 40px; height: 40px; color: #aaa; margin-bottom: 10px; }

        .btn-submit {
            grid-column: span 2;
            padding: 16px;
            background: var(--royal-blue);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        .btn-submit:hover { background: #2e337a; }
        .btn-submit:disabled { background: #ccc; cursor: not-allowed; }

        .status-msg {
            text-align: center;
            margin-top: 20px;
            font-weight: 600;
            min-height: 24px;
        }

        .user-list-card {
            background: white;
            border-radius: var(--radius-md);
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            text-align: left;
            padding: 15px;
            border-bottom: 1px solid #eee;
        }

        th { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: #888; }

        .hidden { display: none; }

        @media (max-width: 600px) {
            .admin-form { grid-template-columns: 1fr; }
            .form-group.full { grid-column: span 1; }
            .btn-submit { grid-column: span 1; }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo">
            <img src="assets/Recurso 1logousman.svg" alt="Usman Mancera Logo">
        </div>
        <a href="index.html" class="btn-pill">Ver Sitio Web</a>
    </header>

    <div class="admin-container">
        <div class="admin-card">
            <div class="admin-header">
                <h1>Panel de Control</h1>
                <p>Registra alumnos y crea galerías en Supabase Storage.</p>
            </div>

            <div class="admin-form">
                <div class="form-group">
                    <label for="adminColegio">Colegio</label>
                    <input type="text" id="adminColegio" class="admin-input" placeholder="Nombre del Colegio" required>
                </div>
                <div class="form-group">
                    <label for="adminNombre">Nombre del Alumno</label>
                    <input type="text" id="adminNombre" class="admin-input" placeholder="Nombre Completo" required>
                </div>
                <div class="form-group">
                    <label for="adminClave">Clave de Acceso</label>
                    <input type="text" id="adminClave" class="admin-input" placeholder="Define una clave segura" required>
                </div>
                <div class="form-group">
                    <label for="adminTelefono">Teléfono del Alumno (Venezuela)</label>
                    <input type="text" id="adminTelefono" class="admin-input" placeholder="Ej: 04121234567">
                </div>

                <div class="form-group full" style="background:#f4f4f4; padding:15px; border-radius:8px; display:flex; align-items:center;">
                    <label style="display:flex; align-items:center; gap:10px; cursor:pointer; font-weight: 500;">
                        <input type="checkbox" id="adminPagado" style="width:20px; height:20px;">
                        <span>Alumno Pagado (Activar envío de WhatsApp con galería y contraseña al registrar)</span>
                    </label>
                </div>

                <button id="btnRegistrar" onclick="registrarNuevoAlumno()" class="btn-submit">
                    CREAR ALUMNO EN EXCEL Y CARPETA
                </button>
            </div>

            <p id="statusMessage" class="status-msg"></p>
        </div>

        <div class="user-list-card">
            <h2>Registros Recientes</h2>
            <div id="usersTableContainer">
                <table>
                    <thead>
                        <tr>
                            <th>Colegio</th>
                            <th>Alumno</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <!-- Datos dinámicos -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://dtoniylozbflssbaoixl.supabase.co";
        const SUPABASE_KEY = "sb_publishable_x2rHkO--OxlC2bNVqrcPeA_0cMp9sXT";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Inicializar iconos
        lucide.createIcons();

        function formatTelefonoVenezuela(telefono) {
            let clean = telefono.replace(/\D/g, '');
            if (!clean) return '';
            if (clean.startsWith('0')) {
                clean = clean.substring(1);
            }
            if (!clean.startsWith('58')) {
                clean = '58' + clean;
            }
            return clean;
        }

        function generarIdGaleria() {
            if (window.crypto && window.crypto.randomUUID) {
                return window.crypto.randomUUID().replace(/-/g, '');
            }
            return `g_${Date.now().toString(36)}_${Math.random().toString(36).slice(2)}`;
        }

        async function registrarNuevoAlumno() {
            const btn = document.getElementById('btnRegistrar');
            const status = document.getElementById('statusMessage');

            const colegio = document.getElementById('adminColegio').value.trim();
            const nombre = document.getElementById('adminNombre').value.trim();
            const clave = document.getElementById('adminClave').value.trim();
            const telefonoRaw = document.getElementById('adminTelefono').value.trim();
            const pagado = document.getElementById('adminPagado').checked;

            if (!colegio || !nombre || !clave) {
                alert("Por favor, llena todos los campos obligatorios.");
                return;
            }

            try {
                btn.disabled = true;
                btn.innerText = "Registrando...";
                status.style.color = "blue";
                status.innerText = "Creando galería en Supabase...";

                const idGaleria = generarIdGaleria();
                const colegioSlug = colegio.toLowerCase().replace(/\s+/g, '-');
                const carpeta = `${colegioSlug}/${idGaleria}`;

                const { error: insertError } = await _supabase.from('alumnos').insert([{ 
                    colegio,
                    nombre,
                    clave,
                    telefono: telefonoRaw,
                    pagado,
                    id_galeria: idGaleria
                }]);

                if (insertError) {
                    throw insertError;
                }

                try {
                    await _supabase.storage.from('galerias').upload(`${carpeta}/.keep`, new Blob(['Galería creada en Supabase'], { type: 'text/plain' }), { cacheControl: '3600', upsert: false });
                } catch (uploadError) {
                    console.warn('No se pudo crear el placeholder en Storage.', uploadError);
                }

                alert("¡Alumno registrado correctamente en Supabase!");

                if (pagado) {
                    const telefono = formatTelefonoVenezuela(telefonoRaw);
                    if (telefono) {
                        const urlGaleria = `Galeria.html?user=${encodeURIComponent(nombre.replace(/\s+/g, ''))}`;
                        const mensaje = `Hola ${nombre}, tu galería de fotos ya está lista. Puedes verla aquí: ${urlGaleria} y tu clave de acceso es: ${clave}`;
                        const waLink = `https://wa.me/${telefono}?text=${encodeURIComponent(mensaje)}`;
                        window.open(waLink, '_blank');
                    } else {
                        alert("Por favor ingresa un teléfono válido para WhatsApp.");
                    }
                }

                setTimeout(() => location.reload(), 1500);
            } catch (error) {
                console.error("Error registrando alumno:", error);
                alert("Error al registrar el alumno en Supabase.");
            } finally {
                btn.disabled = false;
                btn.innerText = "CREAR ALUMNO EN EXCEL Y CARPETA";
            }
        }

        async function loadUsers() {
            try {
                const { data: users, error } = await _supabase.from('alumnos').select('colegio,nombre,clave,id_galeria');
                if (error) throw error;
                const tbody = document.getElementById('usersTableBody');
                tbody.innerHTML = "";

                users.forEach(user => {
                    const nombreEscaped = (user.nombre || '').replace(/'/g, "\\'");
                    const claveEscaped = (user.clave || '').replace(/'/g, "\\'");
                    const row = `<tr>
                        <td>${user.colegio || 'N/A'}</td>
                        <td>${user.nombre || 'N/A'}</td>
                        <td>
                            <a href="Galeria.html?user=${encodeURIComponent((user.nombre || '').replace(/\s+/g, ''))}" target="_blank" style="color: var(--royal-blue); font-weight: 600; margin-right: 15px;">Abrir galería</a>
                            <button onclick="enviarWhatsAppManual('${nombreEscaped}', '${claveEscaped}')" class="btn-pill" style="padding: 5px 12px; font-size: 0.8rem; background: #25D366; color: white; border: none; cursor: pointer; border-radius: var(--radius-pill); font-weight: 600;">
                                WhatsApp
                            </button>
                        </td>
                    </tr>`;
                    tbody.innerHTML += row;
                });
            } catch (error) {
                console.error("Error cargando usuarios:", error);
            }
        }

        function enviarWhatsAppManual(nombre, clave) {
            const tel = prompt("Introduce el teléfono del alumno (se aplicará +58 de Venezuela automáticamente):");
            if (!tel) return;
            const telefonoFormateado = formatTelefonoVenezuela(tel);
            const urlGaleria = `Galeria.html?user=${encodeURIComponent(nombre.replace(/\s+/g, ''))}`;
            const mensaje = `Hola ${nombre}, tu galería de fotos ya está lista. Puedes verla aquí: ${urlGaleria} y tu clave de acceso es: ${clave}`;
            const waLink = `https://wa.me/${telefonoFormateado}?text=${encodeURIComponent(mensaje)}`;
            window.open(waLink, '_blank');
        }

        window.onload = loadUsers;
    </script>
</body>
</html>
