<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usman Mancera | Capturamos el Orgullo</title>
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Font Awesome for the snippet icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="pixieset.css">
</head>

<body>
    <section id="hero-pixieset" class="hero-full">
        <div id="hero-bg" class="hero-background"></div>
        <div class="hero-content">
            <h1 id="hero-nombre">Galería Privada</h1>
            <p>Introduce tus datos para desbloquear tu galería completa</p>

            <div class="login-box" id="login-box">
                <div class="login-field">
                    <select id="colegio" class="pixie-select">
                        <option value="" disabled selected>Cargando colegios...</option>
                    </select>
                </div>
                <div class="login-field">
                    <input list="alumnos-list" id="nombre" class="pixie-input" placeholder="Selecciona tu colegio primero" disabled>
                    <datalist id="alumnos-list"></datalist>
                </div>
                <div class="access-box">
                    <input type="password" id="clave" placeholder="Introduce tu clave aquí">
                    <button onclick="login()">Ver mis fotos</button>
                </div>
            </div>
            <p id="statusMsg" class="status-message"></p>
        </div>
    </section>

    <section id="galeria-section" class="hidden">
        <div class="gallery-header-controls">
             <button id="btn-descarga-zip" onclick="descargarTodasLasFotos()" class="btn-zip" style="display:none; cursor:pointer; border:none; font-family:'Inter', sans-serif;">
                <i class="fas fa-download"></i> Descargar Todo (Foto por Foto)
            </button>
        </div>
        <div id="galeria" class="masonry-grid"></div>
    </section>

    <script src="galeria.js"></script>
</body>

</html>
