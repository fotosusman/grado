<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usman Mancera | Tu Galería Privada</title>
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Font Awesome for the snippet icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="pixieset.css">
</head>

<body>
    <section id="hero-pixieset" class="hero-full minimized">
        <div id="hero-bg" class="hero-background"></div>
        <div class="hero-content">
            <h1 id="hero-nombre">Cargando...</h1>
            <p id="statusMsg" class="status-message">Obteniendo tus fotografías de grado...</p>
        </div>
    </section>

    <section id="galeria-section">
        <div class="gallery-header-controls">
             <button id="btn-descarga-zip" onclick="descargarTodasLasFotos()" class="btn-zip" style="display:none; cursor:pointer; border:none; font-family:'Inter', sans-serif;">
                <i class="fas fa-download"></i> Descargar Todo (Foto por Foto)
             </button>
        </div>
        <div id="galeria" class="masonry-grid"></div>
    </section>

    <script src="galeria.js"></script>
</body>

</html>
